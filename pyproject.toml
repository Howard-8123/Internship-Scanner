[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "internship-scanner"
dynamic = ["version"]
description = "Aggregate and normalize internships across public ATS providers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.9,<4.0",
  "numpy>=1.26,<2.5",
  "pydantic>=2.7,<3.0",
  "python-dotenv>=1.0,<2.0",
  "requests>=2.31,<3.0",
  "sentence-transformers>=3.0,<6.0",
]

[project.scripts]
internship-scanner = "internship_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
internship_scanner = ["data/*.json"]

[tool.setuptools.dynamic]
version = {attr = "internship_scanner.__version__"}

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=internship_scanner --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
omit = ["src/internship_scanner/__main__.py"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
